name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Jobs group by how long their checks take, not by which category they belong to.
# Everything that finishes in seconds shares one job, so a formatter or linter
# failure reports in about a minute. Every check that has to compile or build gets
# a job of its own, so the slow work runs in parallel and no fast check waits behind
# it. No job needs another, and a failing check never skips its siblings, so one run
# reports every failure it can find.
jobs:
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore CSharpier
        run: dotnet tool restore

      - uses: pnpm/action-setup@v6
        with:
          version: '11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install page script dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Every check below runs even when an earlier one fails, so one run reports
      # all of them. The failed step still fails the job.
      - name: CSharpier
        if: ${{ !cancelled() }}
        run: dotnet csharpier check .
      - name: Prettier
        if: ${{ !cancelled() }}
        # Prettier is pinned in web/. The run starts at the repo root, so the root
        # .prettierignore keeps the submodules and temp/ out of the check.
        run: node web/node_modules/prettier/bin/prettier.cjs --check "**/*.{md,json,yaml,yml,toml,css}"
      - name: Page script typecheck
        if: ${{ !cancelled() }}
        run: pnpm --dir web typecheck
      - name: Page script lint
        if: ${{ !cancelled() }}
        run: pnpm --dir web lint
      # The plugin embeds this bundle, so a broken build must fail here.
      - name: Page script build
        if: ${{ !cancelled() }}
        run: pnpm --dir web build

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The plugin project references the game's Managed assemblies, so only the
      # test project builds here; it compiles sources without game dependencies directly.
      - name: Run unit tests
        run: dotnet test XSOverlayKeyboardIme.Tests/XSOverlayKeyboardIme.Tests.csproj -c Release --nologo

  analyzers:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Analyzers only report on a project that compiles, and the plugin cannot
      # compile without the game installed. The test project compiles the portable
      # sources, so it carries the C# analysis here.
      - name: Run analyzers
        run: dotnet format analyzers XSOverlayKeyboardIme.Tests/XSOverlayKeyboardIme.Tests.csproj --verify-no-changes --severity info

  native:
    name: Native library
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Top-level submodules only: IngameIME_Win32 reaches its own copy of
          # IngameIME-Common through an SSH URL, and the build uses the sibling.
          submodules: true
      - name: Build native library
        run: pwsh native/build.ps1 -Configuration Release
